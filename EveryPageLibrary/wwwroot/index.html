<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6EC" />
    <title>EveryPage Library &mdash; Everything Humanity Has Written, Open to Everyone</title>
    <meta name="description" content="EveryPage Library is a free, open digital library. Search community PDF uploads, Project Gutenberg and Open Library, then read online or download directly." />
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;0,700;1,500&family=Patrick+Hand&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FAF6EC',
                        cardPaper: '#FFFDF7',
                        notePaper: '#F2EAD8',
                        ink: '#1C1917',
                        pencil: '#57534E',
                        doghouseRed: '#D93829',
                        woodstockYellow: '#F4C430',
                        skyBlue: '#6BA4B8',
                        sage: '#7C9A7E'
                    },
                    fontFamily: {
                        hand: ['"Patrick Hand"', 'cursive', 'sans-serif'],
                        comic: ['"Architects Daughter"', '"Patrick Hand"', 'cursive'],
                        serif: ['"Lora"', 'Georgia', 'serif'],
                        mono: ['"Courier Prime"', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
</head>

<body class="paper-sheet bg-[#FAF6EC] text-[#1C1917] font-hand selection:bg-[#F4C430]/50 selection:text-[#1C1917] antialiased overflow-x-hidden min-h-screen">
    <div id="app">
        <div class="fixed inset-0 paper-sheet flex flex-col items-center justify-center p-6 text-center select-none">
            <div class="mb-6 bg-[#FFFDF7] border-2 border-[#1C1917] shadow-[4px_4px_0px_#1C1917] rounded-sm overflow-hidden">
                <div class="halftone px-8 pt-6 pb-4">
                    <img src="images/logo.png" alt="EveryPage Library" class="w-40 h-40 mx-auto object-contain" />
                </div>
                <div class="zigzag-band zigzag-band-sm" aria-hidden="true"></div>
            </div>
            <h1 class="font-comic text-3xl sm:text-4xl font-bold text-[#1C1917] tracking-tight mb-2">EveryPage Library</h1>
            <p class="font-mono text-xs uppercase tracking-[0.2em] text-[#57534E]">Setting out the reading cards&hellip;</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 bg-[#FFFDF7] border-2 border-[#1C1917] text-[#1C1917] rounded-sm shadow-[4px_4px_0px_#1C1917] z-50 text-sm max-w-md overflow-hidden">
        <div class="h-1.5 bg-[#D93829] border-b-2 border-[#1C1917]"></div>
        <div class="p-4 flex items-center gap-3 flex-wrap">
            <span class="font-comic font-bold">Oops! A page slipped off the desk.</span>
            <a href="" class="reload font-mono text-xs font-bold uppercase underline text-[#D93829]">Reload</a>
            <a class="dismiss cursor-pointer font-mono text-xs font-bold uppercase text-[#57534E] hover:text-[#1C1917]">Dismiss</a>
        </div>
    </div>

    <script>
        window.EveryPageLibrary = {
            _observer: null,
            _scrollHandler: null,
            _scrollTicking: false,

            observeSentinel: function (element, dotNetHelper) {
                this.disconnectSentinel();
                if (!element || !dotNetHelper) return;

                var trigger = function () {
                    dotNetHelper.invokeMethodAsync('OnScrollBottomReached').catch(function () {});
                };

                this._observer = new IntersectionObserver(function (entries) {
                    if (entries[0] && entries[0].isIntersecting) {
                        trigger();
                    }
                }, { rootMargin: '1600px' });

                this._observer.observe(element);

                var self = this;
                this._scrollHandler = function () {
                    if (self._scrollTicking) return;
                    self._scrollTicking = true;
                    window.requestAnimationFrame(function () {
                        self._scrollTicking = false;
                        var scrollPos = window.scrollY + window.innerHeight;
                        var docHeight = document.documentElement.scrollHeight;
                        if (docHeight - scrollPos <= 1600) {
                            trigger();
                        }
                    });
                };

                window.addEventListener('scroll', this._scrollHandler, { passive: true });
            },

            disconnectSentinel: function () {
                if (this._observer) {
                    this._observer.disconnect();
                    this._observer = null;
                }
                if (this._scrollHandler) {
                    window.removeEventListener('scroll', this._scrollHandler);
                    this._scrollHandler = null;
                }
            },

            _saveBlobToDisk: function (blob, fileName) {
                var objectUrl = URL.createObjectURL(blob);
                var anchor = document.createElement('a');
                anchor.href = objectUrl;
                anchor.download = fileName || 'EveryPage_Book';
                anchor.style.display = 'none';
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
                setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 5000);
            },

            downloadDirectBlob: async function (url, fileName) {
                try {
                    var response = await fetch(url, { mode: 'cors', redirect: 'follow' });
                    if (!response.ok) return false;
                    var blob = await response.blob();
                    if (!blob || blob.size === 0) return false;
                    this._saveBlobToDisk(blob, fileName);
                    return true;
                } catch (err) {
                    return false;
                }
            },

            downloadTextFile: function (fileName, content) {
                try {
                    var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    this._saveBlobToDisk(blob, fileName);
                    return true;
                } catch (error) {
                    console.error('Text download failed:', error);
                    return false;
                }
            },

            openSourcePage: function (url) {
                if (!url) return false;
                window.open(url, '_blank', 'noopener,noreferrer');
                return true;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
