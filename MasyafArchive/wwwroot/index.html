<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EveryPage Library — Everything Humanity Has Written, Open to Everyone</title>
    <meta name="description" content="EveryPage Library is a free, open digital library. Search community PDF uploads, Project Gutenberg and Open Library, then read online or download directly." />
    <base href="/" />

    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        basalt: '#0F0E0D',
                        stoneSurface: '#181614',
                        stoneElevated: '#201E1A',
                        limestoneBorder: '#2E2A25',
                        limestoneHover: '#8C6D3F',
                        parchment: '#EDE6D6',
                        sandstone: '#9E9587',
                        candleGold: '#C8963E',
                        candleGoldHover: '#DDA84B',
                        crimsonSeal: '#9E332D',
                        parchmentBg: '#F5EEDB',
                        parchmentInk: '#262019',
                        parchmentBorder: '#D8CCA8'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>

<body class="bg-[#0F0E0D] text-[#EDE6D6] font-sans selection:bg-[#C8963E]/30 selection:text-[#EDE6D6] antialiased overflow-x-hidden min-h-screen">
    <div id="app">
        <div class="fixed inset-0 bg-[#0F0E0D] flex flex-col items-center justify-center p-6 text-center select-none">
            <!-- Opening-book preloader -->
            <div class="relative w-24 h-24 mb-8 flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border border-[#2E2A25] animate-ping opacity-25"></div>
                <div class="absolute inset-2 rounded-full border border-[#C8963E]/40 animate-spin" style="animation-duration: 8s;"></div>
                <svg class="w-12 h-12 text-[#C8963E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path>
                </svg>
            </div>
            <h1 class="font-serif text-2xl tracking-[0.25em] text-[#EDE6D6] uppercase mb-2">EveryPage Library</h1>
            <p class="font-mono text-xs text-[#9E9587] tracking-widest uppercase">Opening the shelves...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 bg-[#181614] border border-[#9E332D] text-[#EDE6D6] p-4 rounded shadow-2xl z-50 text-sm max-w-md">
        <span>An unhandled error has occurred in the library runtime.</span>
        <a href="" class="reload underline text-[#C8963E] ml-2">Reload</a>
        <a class="dismiss cursor-pointer ml-3 text-[#9E9587]">Dismiss</a>
    </div>

    <!-- Library JS Interop: direct-to-browser downloads -->
    <script>
        window.EveryPageLibrary = {
            /**
             * Downloads a book file straight to the reader's browser, keeping the
             * filename clean. Tries a blob download first; if the remote server
             * blocks cross-origin reads, falls back to a plain anchor download.
             */
            downloadFile: async function (url, fileName) {
                if (!url) {
                    return false;
                }

                try {
                    const response = await fetch(url, { mode: 'cors' });
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    const blob = await response.blob();
                    const objectUrl = URL.createObjectURL(blob);
                    const anchor = document.createElement('a');
                    anchor.href = objectUrl;
                    anchor.download = fileName || 'book';
                    document.body.appendChild(anchor);
                    anchor.click();
                    document.body.removeChild(anchor);
                    setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 2000);
                    return true;
                } catch (error) {
                    console.warn('Blob download unavailable, using direct download:', error);
                    return window.EveryPageLibrary.downloadFromUrl(url, fileName);
                }
            },

            /** Plain anchor download — used when blob reading is blocked. */
            downloadFromUrl: function (url, fileName) {
                try {
                    const anchor = document.createElement('a');
                    anchor.href = url;
                    anchor.download = fileName || '';
                    anchor.target = '_blank';
                    anchor.rel = 'noopener';
                    document.body.appendChild(anchor);
                    anchor.click();
                    document.body.removeChild(anchor);
                    return true;
                } catch (error) {
                    console.error('Download failed:', error);
                    return false;
                }
            },

            /** Saves plain text (e.g. a Gutenberg .txt edition) under a clean name. */
            downloadTextFile: function (fileName, content) {
                try {
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const objectUrl = URL.createObjectURL(blob);
                    const anchor = document.createElement('a');
                    anchor.href = objectUrl;
                    anchor.download = fileName;
                    document.body.appendChild(anchor);
                    anchor.click();
                    document.body.removeChild(anchor);
                    setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 2000);
                    return true;
                } catch (error) {
                    console.error('Text download failed:', error);
                    return false;
                }
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
