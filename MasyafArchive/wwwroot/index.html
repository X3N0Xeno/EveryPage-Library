<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Everyday Library &mdash; Everything Humanity Has Written, Open to Everyone</title>
    <meta name="description" content="Everyday Library is a free, open digital library. Search community PDF uploads, Project Gutenberg and Open Library, then read online or download directly." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

                        cardPaper: '#FFFDF7',
                        notePaper: '#F2EAD8',

                        woodstockYellow: '#F4C430',
                        skyBlue: '#6BA4B8'
                    },
                    fontFamily: {
                        hand: ['"Patrick Hand"', 'cursive', 'sans-serif'],
                        comic: ['"Architects Daughter"', '"Patrick Hand"', 'cursive'],
                        serif: ['"Lora"', 'Georgia', 'serif'],
                        mono: ['"Courier Prime"', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>

<body class="paper-sheet bg-[#FAF6EC] text-[#1C1917] font-hand selection:bg-[#F4C430]/50 selection:text-[#1C1917] antialiased overflow-x-hidden min-h-screen">
    <div id="app">
        <div class="fixed inset-0 paper-sheet bg-[#FAF6EC] flex flex-col items-center justify-center p-6 text-center select-none">
            <div class="mb-5">
                <svg class="w-28 h-28 mx-auto" viewBox="0 0 140 130" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="20,72 70,38 120,72" fill="#D93829" stroke="#1C1917" stroke-width="3" stroke-linejoin="round"/>
                    <rect x="30" y="72" width="80" height="46" fill="#D93829" stroke="#1C1917" stroke-width="3"/>
                    <line x1="30" y1="87" x2="110" y2="87" stroke="#1C1917" stroke-width="2"/>
                    <line x1="30" y1="102" x2="110" y2="102" stroke="#1C1917" stroke-width="2"/>
                    <ellipse cx="64" cy="34" rx="14" ry="9" fill="#FFFDF7" stroke="#1C1917" stroke-width="2.5"/>
                    <ellipse cx="56" cy="36" rx="5" ry="7" fill="#1C1917"/>
                    <circle cx="76" cy="31" r="2.2" fill="#1C1917"/>
                    <path d="M77 35 Q83 37 88 33" stroke="#1C1917" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <ellipse cx="44" cy="36" rx="11" ry="6" fill="#FFFDF7" stroke="#1C1917" stroke-width="2.5"/>
                    <rect x="82" y="25" width="16" height="12" rx="2" fill="#57534E" stroke="#1C1917" stroke-width="2"/>
                    <rect x="85" y="16" width="10" height="10" fill="#FFFDF7" stroke="#1C1917" stroke-width="1.8" class="animate-bounce"/>
                </svg>
            </div>
            <h1 class="font-comic text-2xl sm:text-3xl font-bold text-[#1C1917] tracking-wide mb-1">Everyday Library</h1>
            <p class="font-mono text-xs text-[#57534E]">*clack-clack-ding!* Setting out the reading cards...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 bg-[#FFFDF7] border-2 border-[#D93829] text-[#1C1917] p-4 rounded-sm shadow-[4px_4px_0px_#1C1917] z-50 text-sm max-w-md">
        <span>Oops! A page slipped off the desk.</span>
        <a href="" class="reload underline font-bold text-[#D93829] ml-2">Reload</a>
        <a class="dismiss cursor-pointer ml-3 text-[#57534E]">Dismiss</a>
    </div>

    <script>
        window.EverydayLibrary = {
            _observer: null,
            _scrollHandler: null,
            _scrollTicking: false,

            observeSentinel: function (element, dotNetHelper) {
                this.disconnectSentinel();
                if (!element || !dotNetHelper) return;

                var trigger = function () {
                    dotNetHelper.invokeMethodAsync('OnScrollBottomReached').catch(function () {});
                };

                this._observer = new IntersectionObserver(function (entries) {
                    if (entries[0] && entries[0].isIntersecting) {
                        trigger();
                    }
                }, { rootMargin: '1600px' });

                this._observer.observe(element);

                var self = this;
                this._scrollHandler = function () {
                    if (self._scrollTicking) return;
                    self._scrollTicking = true;
                    window.requestAnimationFrame(function () {
                        self._scrollTicking = false;
                        var scrollPos = window.scrollY + window.innerHeight;
                        var docHeight = document.documentElement.scrollHeight;
                        if (docHeight - scrollPos <= 1600) {
                            trigger();
                        }
                    });
                };

                window.addEventListener('scroll', this._scrollHandler, { passive: true });
            },

            disconnectSentinel: function () {
                if (this._observer) {
                    this._observer.disconnect();
                    this._observer = null;
                }
                if (this._scrollHandler) {
                    window.removeEventListener('scroll', this._scrollHandler);
                    this._scrollHandler = null;
                }
            },

            _saveBlobToDisk: function (blob, fileName) {
                var objectUrl = URL.createObjectURL(blob);
                var anchor = document.createElement('a');
                anchor.href = objectUrl;
                anchor.download = fileName || 'Everyday_Book';
                anchor.style.display = 'none';
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
                setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 5000);
            },

            downloadDirectBlob: async function (url, fileName) {
                try {
                    var response = await fetch(url, { mode: 'cors', redirect: 'follow' });
                    if (!response.ok) return false;
                    var blob = await response.blob();
                    if (!blob || blob.size === 0) return false;
                    this._saveBlobToDisk(blob, fileName);
                    return true;
                } catch (err) {
                    return false;
                }
            },

            downloadTextFile: function (fileName, content) {
                try {
                    var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    this._saveBlobToDisk(blob, fileName);
                    return true;
                } catch (error) {
                    console.error('Text download failed:', error);
                    return false;
                }
            },

            openSourcePage: function (url) {
                if (!url) return false;
                window.open(url, '_blank', 'noopener,noreferrer');
                return true;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
