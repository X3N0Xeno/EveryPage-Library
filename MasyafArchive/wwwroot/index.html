<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Masyaf Archive — Subterranean Codex Library</title>
    <base href="/" />

    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        basalt: '#0F0E0D',
                        stoneSurface: '#181614',
                        stoneElevated: '#201E1A',
                        limestoneBorder: '#2E2A25',
                        limestoneHover: '#8C6D3F',
                        parchment: '#EDE6D6',
                        sandstone: '#9E9587',
                        candleGold: '#C8963E',
                        candleGoldHover: '#DDA84B',
                        crimsonSeal: '#9E332D',
                        parchmentBg: '#F5EEDB',
                        parchmentInk: '#262019',
                        parchmentBorder: '#D8CCA8'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>

<body class="bg-[#0F0E0D] text-[#EDE6D6] font-sans selection:bg-[#C8963E]/30 selection:text-[#EDE6D6] antialiased overflow-x-hidden min-h-screen">
    <div id="app">
        <div class="fixed inset-0 bg-[#0F0E0D] flex flex-col items-center justify-center p-6 text-center select-none">
            <!-- Animated Masyaf Memory Seal Preloader -->
            <div class="relative w-24 h-24 mb-8 flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border border-[#2E2A25] animate-ping opacity-25"></div>
                <div class="absolute inset-2 rounded-full border border-[#C8963E]/40 animate-spin" style="animation-duration: 8s;"></div>
                <svg class="w-12 h-12 text-[#C8963E]" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="50,10 90,80 50,65 10,80" />
                    <circle cx="50" cy="50" r="14" />
                </svg>
            </div>
            <h1 class="font-serif text-2xl tracking-[0.25em] text-[#EDE6D6] uppercase mb-2">The Masyaf Archive</h1>
            <p class="font-mono text-xs text-[#9E9587] tracking-widest uppercase">Unsealing Subterranean Sanctum...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 bg-[#181614] border border-[#9E332D] text-[#EDE6D6] p-4 rounded shadow-2xl z-50 text-sm max-w-md">
        <span>An unhandled error has occurred in the library runtime.</span>
        <a href="" class="reload underline text-[#C8963E] ml-2">Reload</a>
        <a class="dismiss cursor-pointer ml-3 text-[#9E9587]">Dismiss</a>
    </div>

    <!-- Archival JS Interop Utilities -->
    <script>
        window.MasyafArchive = {
            downloadTextFile: function(filename, content) {
                try {
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    return true;
                } catch (e) {
                    console.error("Download failed:", e);
                    return false;
                }
            },
            downloadFromUrl: function(url, filename) {
                try {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename || '';
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    return true;
                } catch (e) {
                    console.error("Url download failed:", e);
                    return false;
                }
            },
            triggerFileInput: function(elementId) {
                const el = document.getElementById(elementId);
                if (el) el.click();
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
